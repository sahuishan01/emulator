[package]
name = "emulator-android-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
emulator-shader = { path = "../shader" }
emulator-session = { path = "../session" }
emulator-memory = { path = "../memory" }
emulator-gpu = { path = "../gpu" }
emulator-services = { path = "../services" }

# Audited exception for the exported symbol attribute only. This boundary has
# no raw pointer arguments, borrowed outputs or unsafe blocks. Engine crates
# retain the workspace unsafe_code=forbid policy.
[lints.rust]
unsafe_code = "allow"
