[workspace]
members = ["crates/memory", "crates/a64", "crates/loader", "crates/ipc", "crates/kernel", "crates/services", "crates/session", "crates/texture", "crates/gpu", "crates/cli", "crates/android-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
